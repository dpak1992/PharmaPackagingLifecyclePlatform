[project]
name = "pharma-packaging-lifecycle"
version = "0.1.0"
description = "Pharmaceutical packaging lifecycle platform - parametric dieline generation and artwork composition"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "ezdxf>=1.0",
    "reportlab>=4.0",
    "python-barcode>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packaging_model", "src/dieline_engine", "src/artwork_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
